name: Publish SAT Study Room
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version tag for portable HTML release'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sat-study-room-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate committed website
        run: |
          python3 prepare-site.py
          python3 validate.py
          for file in dist/*.js; do node --check "$file"; done
          rm -f dist/question-data.zip
          touch dist/.nojekyll
          python3 -m zipfile -c sat-study-room-website.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: sat-study-room-downloads
          path: |
            dist/sat-study-room-local.html
            sat-study-room-website.zip
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website from repository
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sat-study-room-downloads
          path: downloads
      - name: Attach portable HTML and static website to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "SAT Study Room $RELEASE_TAG" --notes 'Standalone SAT practice website with portable HTML and complete static-site downloads. Original application code is MIT; third-party question content is excluded.'
          find downloads -type f \( -name '*.html' -o -name '*.zip' \) -exec gh release upload "$RELEASE_TAG" {} --clobber \;
